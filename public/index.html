<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Vértice</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0a0a;
  color: #fff;
  display: flex;
}

.sidebar {
  width: 200px;
  background: #111;
  padding: 20px;
}

.nav-item {
  padding: 10px;
  cursor: pointer;
  margin-bottom: 5px;
  background: #1a1a1a;
}

.nav-item:hover {
  background: #333;
}

.main {
  flex: 1;
  padding: 20px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.card {
  background: #1a1a1a;
  padding: 20px;
  margin-bottom: 20px;
}

button {
  padding: 10px;
  background: purple;
  color: white;
  border: none;
  cursor: pointer;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-bottom: 10px;
  background: #222;
  color: #fff;
  border: 1px solid #444;
}
</style>

</head>

<body>

<div class="sidebar">
  <div class="nav-item" onclick="nav('master')">🧠 Plano Completo</div>
</div>

<div class="main">

  <div id="page-master" class="page active">

    <div class="card">
      <h2>Plano Completo</h2>

      <label>Objetivo</label>
      <select id="objetivo">
        <option>Vender mais</option>
        <option>Crescer seguidores</option>
        <option>Engajar</option>
      </select>

      <label>Produto</label>
      <input id="produto" placeholder="Ex: Pizza artesanal">

      <button onclick="runMaster()">Gerar plano</button>
    </div>

    <div class="card">
      <h3>Resultado</h3>
      <div id="output">Clique no botão...</div>
    </div>

  </div>

</div>

<script>

function nav(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
}

async function runMaster() {
  const objetivo = document.getElementById('objetivo').value;
  const produto = document.getElementById('produto').value;

  document.getElementById('output').innerText = "Gerando...";

  const prompt = `
Crie um plano de marketing completo.

Objetivo: ${objetivo}
Produto: ${produto}

Inclua:
- Persona
- Plano semanal
- 3 posts
- Ideias de imagens
- Respostas de comentários
- Script de vendas
`;

  // SIMULAÇÃO (por enquanto)
  const resposta = `
📌 PERSONA:
Pessoas que gostam de ${produto}

📅 PLANO:
Postar 3 vezes na semana focando em ${objetivo}

📝 POSTS:
1. Você já experimentou ${produto}?
2. O segredo por trás de ${produto}
3. Promoção especial hoje

🎨 VISUAL:
Fotos chamativas do produto

💬 COMENTÁRIOS:
"Chama no direct!"

💰 VENDAS:
"Oi! Vi que você se interessou, posso te ajudar?"
`;

  setTimeout(() => {
    document.getElementById('output').innerText = resposta;
  }, 1000);
}

</script>

</body>
</html>
